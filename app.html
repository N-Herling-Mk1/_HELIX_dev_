<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H.E.L.I.X — Shell</title>
<meta name="description" content="HELIX View Shell — research views and documentation for hidden-sector signal acquisition.">
<!-- Social / Open Graph — update the og:url + image base to your deploy URL -->
<meta property="og:title"       content="H·E·L·I·X — View Shell">
<meta property="og:description" content="Research views and documentation · HEP · Epistemic · Learning · Information Theory · Exploration">
<meta property="og:image"       content="https://n-herling-mk1.github.io/_HELIX_dev_/assets/img/Soc_media_tag.png">
<meta property="og:url"         content="https://n-herling-mk1.github.io/_HELIX_dev_/app.html">
<meta property="og:type"        content="website">
<meta name="twitter:card"       content="summary_large_image">
<meta name="twitter:title"      content="H·E·L·I·X — View Shell">
<meta name="twitter:description" content="Research views and documentation · HEP · Epistemic · Learning · Information Theory · Exploration">
<meta name="twitter:image"      content="https://n-herling-mk1.github.io/_HELIX_dev_/assets/img/Soc_media_tag.png">
<link rel="icon" type="image/x-icon" href="assets/img/helix_64.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Exo+2:wght@200;300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/core.css">
<link rel="stylesheet" href="css/shell.css">
</head>
<body>
<div class="grid-bg"></div>
<div class="scanlines"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<!-- ════ TOPBAR ════ -->
<header class="topbar">
  <div class="brand">
    <span class="wm">H<span class="dot">·</span>E<span class="dot">·</span>L<span class="dot">·</span>I<span class="dot">·</span>X</span>
    <span class="tag">VIEW SHELL</span>
  </div>
  <span class="ctl-div" aria-hidden="true"></span>
  <div class="nav-group">
    <button class="navbtn" id="splash-btn" title="Return to the splash screen">
      <span class="navbtn-glyph" aria-hidden="true">‹</span>
      <span>Back&nbsp;to&nbsp;Splash</span>
    </button>
    <button class="navbtn" id="fx-toggle" title="Logo animation controls">Brand&nbsp;Toggle</button>
  </div>
  <span class="ctl-div" aria-hidden="true"></span>
  <div class="vt-wrap">
    <span class="vt-legend">View Toggle</span>
    <div class="viewtoggle" id="modes" role="tablist" aria-label="Research view">
      <button class="vt-cell" data-mode="traditional" role="tab" aria-selected="true">
        <span class="vt-hex vt-trad" aria-hidden="true"></span>
        <span class="vt-label">Traditional</span>
      </button>
      <button class="vt-cell" data-mode="nova" role="tab" aria-selected="false">
        <span class="vt-hex vt-nova" aria-hidden="true"></span>
        <span class="vt-label">Helix&nbsp;Nova</span>
      </button>
      <span class="vt-sep" aria-hidden="true"></span>
      <button class="vt-switch" id="vt-switch" role="switch" aria-checked="false"
              aria-label="Toggle Traditional / Helix Nova" title="Toggle view">
        <span class="vt-knob" aria-hidden="true"></span>
      </button>
    </div>
  </div>
  <span class="ctl-div" aria-hidden="true"></span>
  <button class="docbtn" id="docbtn" data-view="docs" aria-label="Documentation view" aria-selected="false">
    <span class="docbtn-glyph" aria-hidden="true">▤</span>
    <span class="docbtn-txt">Documentation</span>
  </button>
  <span class="ctl-div" aria-hidden="true"></span>
  <div class="status">
    <span class="sv-box"><b id="status-view">—</b></span>
    <span class="led" title="shell online"></span>
  </div>
</header>

<!-- ════ PERSISTENT ANIMATED LOGO (constant across all view swaps) ════ -->
<div id="shell-logo" title="HELIX — click to glitch">
  <canvas id="shell-logo-canvas" width="200" height="200"></canvas>
</div>

<!-- ════ FX CONTROL PANEL (shell-level analogue of Energy Panel 2) ════ -->
<aside id="fx-panel" aria-label="Logo FX controls">
  <div class="fxh">⚡ Logo Animation</div>
  <div class="fxlabel">Logo image</div>
  <div class="fxrow">
    <button class="fxbtn active" data-logo="0">Spiral</button>
    <button class="fxbtn" data-logo="1">Sleek</button>
    <button class="fxbtn" data-logo="2">Abstract</button>
  </div>
  <div class="fxlabel">Effect</div>
  <div class="fxrow">
    <button class="fxbtn active" data-fx="rgb">RGB + CRT</button>
    <button class="fxbtn" data-fx="laser">Laser Etch</button>
  </div>
  <div class="fxdiv"></div>
  <div class="fxrow">
    <button class="fxbtn" data-act="trigger">▶ Trigger</button>
    <button class="fxbtn active" data-act="auto">Auto</button>
    <button class="fxbtn warn" data-act="reset">↺ Reset</button>
  </div>
</aside>

<!-- ════ STAGE ════ -->
<main class="stage">
  <iframe id="view-frame" title="HELIX active view"
          sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-downloads allow-forms"></iframe>
  <div class="veil" id="veil"><div class="vtxt">DEPLOYING VIEW</div></div>
</main>

<!-- glitch engine first (defines window.HELIX_GLITCH), then the shell router boots it -->
<script src="js/glitch.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
