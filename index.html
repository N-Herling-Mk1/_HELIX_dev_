<style>
  :root{
    --bg:#04070b;
    --panel:#070d14;
    --ink:#9fdcf4;
    --ink-dim:#3f6e86;
    --ink-faint:#1b3a4a;
    --cyan:#4fd6ff;
    --cyan-deep:#1f8fc4;
    --amber:#ffb24a;
    --orange:#ff7a30;
    --line:rgba(79,214,255,0.16);
    --line-soft:rgba(79,214,255,0.07);
    --glow-cyan:0 0 12px rgba(79,214,255,0.55);
    --glow-amber:0 0 14px rgba(255,140,50,0.5);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;min-height:640px}
  body{
    background:
      radial-gradient(1200px 700px at 30% -10%, rgba(31,143,196,0.10), transparent 60%),
      radial-gradient(900px 600px at 110% 120%, rgba(255,122,48,0.06), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Chakra Petch", monospace;
    overflow:hidden;
  }
  .app{
    display:grid;
    grid-template-columns:1fr;
    width:100%;height:100vh;min-height:640px;
  }

  /* ============ STAGE (left) ============ */
  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:26px;
    padding:16px 18px;
    min-width:0;
    overflow:hidden;
  }
  /* faint engineering grid behind everything */
  .stage::before{
    content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
    -webkit-mask-image:radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
  }
  .kicker{
    position:relative;z-index:2;
    font-size:10.5px;letter-spacing:0.42em;text-transform:uppercase;
    color:var(--ink-dim);
    display:flex;align-items:center;gap:12px;
  }
  .kicker .dot{width:5px;height:5px;border-radius:50%;background:var(--amber);box-shadow:var(--glow-amber)}

  /* header row: kicker on the left, animation controls on the right */
  .kicker-row{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;}
  .anim-ctl{display:flex;align-items:center;justify-content:center;gap:10px;}
  .anim-ctl button{font-family:inherit;font-size:9px;letter-spacing:0.28em;text-transform:uppercase;
    color:var(--ink-dim);background:rgba(255,170,40,0.04);border:1px solid rgba(255,170,40,0.22);
    border-radius:5px;padding:6px 11px;cursor:pointer;transition:all .16s;white-space:nowrap;}
  .anim-ctl button:hover{color:var(--amber);border-color:var(--amber);box-shadow:var(--glow-amber);background:rgba(255,170,40,0.08);}
  .anim-ctl button:active{transform:translateY(1px);}
  .anim-ctl .ac-sep{width:1px;height:14px;background:rgba(255,170,40,0.25);}

  /* ---- CRT monitor ---- */
  .console{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    width:min(98%, 1180px);
  }
  .crt-wrap{position:relative;width:100%;}
  .crt{
    position:relative;
    width:100%;
    aspect-ratio:1/1;            /* set from JS via TUBE_AR */
    border-radius:22px/26px;
    background:#000;
    overflow:hidden;
    box-shadow:
      0 0 0 2px rgba(79,214,255,0.10),
      0 0 0 9px #0a121a,
      0 0 0 10px rgba(79,214,255,0.10),
      0 26px 70px rgba(0,0,0,0.85),
      inset 0 0 90px rgba(0,0,0,0.9);
    isolation:isolate;
  }
  #screen{
    position:absolute;inset:0;width:100%;height:100%;display:block;
    /* subtle barrel pull via scale; the vignette sells the curve */
    transform:scale(1.012);
  }
  .crt .ov{position:absolute;inset:0;pointer-events:none}
  /* phosphor scanlines */
  .crt .scan{
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,calc(0.34*var(--scan,0.6))) 3px,
      rgba(0,0,0,calc(0.34*var(--scan,0.6))) 4px);
    mix-blend-mode:multiply;
    z-index:5;
  }
  /* RGB shadow-mask (aperture grille) */
  .crt .mask{
    background:repeating-linear-gradient(
      to right,
      rgba(255,0,0,0.05) 0px, rgba(255,0,0,0.05) 1px,
      rgba(0,255,0,0.05) 1px, rgba(0,255,0,0.05) 2px,
      rgba(0,80,255,0.06) 2px, rgba(0,80,255,0.06) 3px);
    mix-blend-mode:screen;opacity:0.55;z-index:6;
  }
  /* curvature vignette */
  .crt .vig{
    background:radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 86%, rgba(0,0,0,0.92) 100%);
    z-index:7;
  }
  /* glass reflection sheen */
  .crt .glass{
    background:linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 32%);
    z-index:8;
    border-radius:inherit;
  }
  /* laser etch + glass cracks burn onto the front of the tube */
  #etch{
    position:absolute;inset:0;width:100%;height:100%;display:block;
    z-index:9;pointer-events:none;
  }
  /* once live, the whole lit screen is the entry button */
  #enterBtn{
    position:absolute;inset:0;width:100%;height:100%;
    background:transparent;border:0;outline:0;border-radius:inherit;
    z-index:10;cursor:default;opacity:0;pointer-events:none;
  }
  #enterBtn.live{cursor:pointer;pointer-events:auto}
  /* power-on / surge flash */
  .crt .surge{background:#dff4ff;opacity:0;z-index:12;transition:opacity .08s ease}
  .crt.surge-on .surge{opacity:0.85}
  /* power-off collapse line */
  .crt.off .ov.collapse{
    z-index:13;background:#cfeeff;
    top:50%;height:2px;opacity:1;
    animation:collapse .42s ease forwards;
  }
  @keyframes collapse{
    0%{top:0;height:100%;opacity:0}
    35%{top:0;height:100%;opacity:.18}
    75%{top:calc(50% - 1px);height:2px;opacity:1}
    100%{top:50%;height:1px;opacity:0;transform:scaleX(.0)}
  }

  /* ---- status line ---- */
  .status{
    position:relative;z-index:2;
    font-family:"Chakra Petch",monospace;
    font-size:11px;letter-spacing:0.16em;text-transform:uppercase;
    color:var(--ink-dim);
    display:flex;align-items:center;gap:10px;min-height:14px;
  }
  .status .led{width:7px;height:7px;border-radius:50%;background:var(--ink-dim);transition:.2s}
  .status .led.go{background:var(--amber);box-shadow:var(--glow-amber)}
  .status .led.live{background:#52ffa6;box-shadow:0 0 12px rgba(82,255,166,.6)}
  .status b{color:var(--cyan);font-weight:600}

  /* ============ SPEC PANEL (right) ============ */
  .panel{
    position:relative;
    background:
      linear-gradient(180deg, rgba(79,214,255,0.04), transparent 18%),
      var(--panel);
    border-left:1px solid var(--line);
    padding:18px 16px 20px;
    overflow-y:auto;
    font-size:12px;
  }
  .panel::-webkit-scrollbar{width:8px}
  .panel::-webkit-scrollbar-thumb{background:rgba(79,214,255,0.18);border-radius:4px}
  .brand{
    display:flex;align-items:baseline;gap:8px;
    font-family:"Orbitron",sans-serif;font-weight:900;
    font-size:19px;letter-spacing:0.10em;color:#eaf8ff;
    text-shadow:0 0 16px rgba(79,214,255,0.35);
  }
  .brand small{
    font-family:"Chakra Petch";font-weight:600;font-size:9px;letter-spacing:0.30em;
    color:var(--orange);text-shadow:var(--glow-amber);text-transform:uppercase;
  }
  .sub{margin-top:4px;font-size:9.5px;letter-spacing:0.26em;color:var(--ink-dim);text-transform:uppercase}
  .rule{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:16px 0 14px}

  .sec-h{
    display:flex;align-items:center;gap:8px;
    font-size:9.5px;letter-spacing:0.28em;text-transform:uppercase;
    color:var(--amber);margin:18px 0 10px;
  }
  .sec-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,178,74,0.4),transparent)}
  .sec-h:first-of-type{margin-top:4px}

  .ctl{margin-bottom:13px}
  .ctl .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .ctl label{font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink)}
  .ctl .val{font-size:11px;color:#cdeeff;font-variant-numeric:tabular-nums;
    background:rgba(79,214,255,0.07);padding:1px 7px;border-radius:3px;min-width:42px;text-align:right}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:linear-gradient(90deg,var(--cyan-deep),rgba(79,214,255,0.12));
    border-radius:2px;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--cyan);cursor:pointer;box-shadow:var(--glow-cyan);border:2px solid #07151d}
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;background:var(--cyan);
    border:2px solid #07151d;box-shadow:var(--glow-cyan);cursor:pointer}

  select{
    width:100%;background:#08141c;color:#cdeeff;border:1px solid var(--line);
    font-family:inherit;font-size:12px;padding:6px 8px;border-radius:4px;outline:none;cursor:pointer}
  select:focus{border-color:var(--cyan)}

  .btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    font-family:inherit;font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;
    padding:9px 10px;border-radius:5px;cursor:pointer;transition:.13s;margin-top:4px;
    background:linear-gradient(180deg,rgba(79,214,255,0.10),rgba(79,214,255,0.02));
    border:1px solid var(--line);color:var(--cyan);
  }
  .btn:hover{border-color:var(--cyan);box-shadow:var(--glow-cyan);color:#dff6ff}
  .btn:active{transform:translateY(1px)}
  .btn.amber{
    background:linear-gradient(180deg,rgba(255,140,50,0.12),rgba(255,140,50,0.02));
    border-color:rgba(255,140,50,0.4);color:var(--amber)}
  .btn.amber:hover{border-color:var(--orange);box-shadow:var(--glow-amber);color:#ffd9a8}

  .swatches{display:flex;gap:7px;margin-top:8px}
  .sw{flex:1;height:22px;border-radius:4px;cursor:pointer;border:1px solid transparent;opacity:.55;transition:.13s}
  .sw[data-on="1"]{opacity:1;border-color:#cdeeff;box-shadow:0 0 10px currentColor}

  .cfgdump{
    font-family:"Chakra Petch",monospace;font-size:10px;line-height:1.5;
    color:#bfe9ff;white-space:pre;overflow-x:auto;
    background:rgba(79,214,255,0.03);border:1px solid var(--line-soft);
    border-radius:6px;padding:9px 10px;margin-bottom:6px;
  }
  .cfgdump .ckey{color:var(--orange)}
  .readout{
    margin-top:16px;font-family:"Chakra Petch",monospace;font-size:10px;line-height:1.65;
    color:var(--ink-dim);border:1px solid var(--line-soft);border-radius:6px;padding:10px 11px;
    background:rgba(79,214,255,0.02);
  }
  .readout .ln{display:flex;gap:8px}
  .readout .k{color:var(--orange);min-width:62px;letter-spacing:.1em}
  .readout .v{color:#bfe9ff}

  @media (max-width:880px){
    .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
    .panel{border-left:0;border-top:1px solid var(--line);max-height:42vh}
    .console{width:min(94vw,1180px)}
  }
</style>

<body>
<div class="app">
  <!-- ============ STAGE ============ -->
  <section class="stage">
    <div class="kicker-row">
      <div class="anim-ctl">
        <button id="skipBtn" type="button">Skip Animation</button>
        <span class="ac-sep" aria-hidden="true"></span>
        <button id="replayBtn" type="button">Replay Animation</button>
      </div>
      <div class="kicker"><span class="dot"></span>Hidden-sector signal acquisition<span class="dot"></span></div>
    </div>

    <div class="console">
      <div class="crt-wrap">
        <div class="crt" id="crt">
          <canvas id="screen"></canvas>
          <div class="ov scan"></div>
          <div class="ov mask"></div>
          <div class="ov vig"></div>
          <div class="ov glass"></div>
          <canvas id="etch"></canvas>
          <button id="enterBtn" aria-label="Press to enter"></button>
          <div class="ov surge"></div>
          <div class="ov collapse"></div>
        </div>
      </div>

      <div class="status" id="status"><span class="led" id="led"></span><span id="statusText">cold start</span></div>
    </div>
  </section>
</div>

<script>
/* =====================================================================
   HELIX — CRT boot + laser-etched entry prompt
   ---------------------------------------------------------------------
   Pipeline is taint-free: getImageData is only ever called on our own
   procedural noise buffer, never on the logo. So channel-split chromatic
   aberration + horizontal granulation work over file://, Flask, and
   GitHub Pages alike.
   ===================================================================== */

/* ---------------------------------------------------------------------
   LOGO SOURCE
   ---------------------------------------------------------------------
   This preview build embeds the logo so it renders anywhere.
   LOCALLY: just flip the line below to LOCAL_SRC and drop your original
   PNG beside this file as helix_logo.png (then you can delete EMBEDDED_SRC).
   --------------------------------------------------------------------- */
const LOGO_SRC = 'assets/img/Soc_media_tag.png';   // repo asset
const ENTER_TEXT = 'PRESS \u2009 TO \u2009 ENTER';

/* ---- tunables (driven by the spec panel) ---- */
const CFG = {
  pixel:   3,
  chroma:  11,
  gran:    7,
  noise:   34,
  scroll:  30,
  scan:    60,
  flicker: 56,
  fade:    5.0,
  hold:    1.6,
  etch:    1.0,
  sparks:  6.0,
  flare:   1.5,
  color:   'red'
};

const LASER_PALETTES = {
  amber:  { beam:'rgb(255,130,40)',  glow:'rgba(255,140,50,0.85)', hot:'#ffb040', hot2:'#ffd888', flare:[255,150,60],  css:'#ff9a3c' },
  red:    { beam:'rgb(255,60,60)',   glow:'rgba(255,70,60,0.85)',  hot:'#ff5050', hot2:'#ff9090', flare:[255,80,70],   css:'#ff5a5a' },
  green:  { beam:'rgb(70,255,130)',  glow:'rgba(80,255,140,0.85)', hot:'#40ff80', hot2:'#b0ffc8', flare:[90,255,150],  css:'#46ff8c' },
  cyan:   { beam:'rgb(50,200,255)',  glow:'rgba(70,210,255,0.85)', hot:'#40c8ff', hot2:'#a0e0ff', flare:[80,210,255],  css:'#4fd6ff' },
  violet: { beam:'rgb(200,90,255)',  glow:'rgba(200,100,255,0.85)',hot:'#c870ff', hot2:'#e0b0ff', flare:[210,110,255], css:'#c878ff' },
};

/* ===================== SCREEN (CRT) ===================== */
const screenCv = document.getElementById('screen');
const sctx = screenCv.getContext('2d');
const crtEl = document.getElementById('crt');

/* Tube aspect ratio (width/height). 1 = square (matches the real square logo).
   Set to 4/3 for a classic TV. Drives both the CSS box and the work buffer. */
const TUBE_AR = 1201/630;   // widescreen — matches the HELIX wordmark
crtEl.style.aspectRatio = String(TUBE_AR);
const WORKH = 680, WORKW = Math.round(WORKH * TUBE_AR);   // work buffer matches tube
const work  = makeCv(WORKW, WORKH);
const work2 = makeCv(WORKW, WORKH);
const wctx  = work.getContext('2d');
const w2ctx = work2.getContext('2d');

let logo = null, logoReady = false, logoFailed = false;
let chR=null, chG=null, chB=null, logoFit=null;

function makeCv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

/* cover-fit rect: fill the whole tube, crop the image's black margins */
function computeFit(){
  const ar = logo.width / logo.height;
  const bar = WORKW / WORKH;
  let w,h;
  if (ar > bar){ h = WORKH; w = h * ar; }    // wider than tube -> match height
  else { w = WORKW; h = w / ar; }            // taller than tube -> match width
  return { x:(WORKW-w)/2, y:(WORKH-h)/2, w, h };
}

/* build R / G / B channel canvases via multiply isolation (no getImageData).
   destination-in clips each channel to the image rect so empty areas stay
   transparent (and render black) instead of bleeding to white. */
function buildChannels(){
  logoFit = computeFit();
  const make = (mulColor) => {
    const c = makeCv(WORKW, WORKH);
    const g = c.getContext('2d');
    g.clearRect(0,0,WORKW,WORKH);
    g.drawImage(logo, logoFit.x, logoFit.y, logoFit.w, logoFit.h);
    g.globalCompositeOperation = 'multiply';
    g.fillStyle = mulColor;
    g.fillRect(0,0,WORKW,WORKH);
    g.globalCompositeOperation = 'destination-in';
    g.drawImage(logo, logoFit.x, logoFit.y, logoFit.w, logoFit.h);
    g.globalCompositeOperation = 'source-over';
    return c;
  };
  chR = make('#ff0000');
  chG = make('#00ff00');
  chB = make('#0000ff');
}

/* ---- procedural analog noise (own buffer → never taints) ---- */
const NW = 240, NH = 180;
const noiseCv = makeCv(NW, NH);
const nctx = noiseCv.getContext('2d');
const noiseImg = nctx.createImageData(NW, NH);
function regenNoise(){
  const d = noiseImg.data;
  for (let i=0;i<d.length;i+=4){
    const v = (Math.random()*255)|0;
    d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]=255;
  }
  nctx.putImageData(noiseImg,0,0);
}
regenNoise();

/* ---- timeline / phase machine ---- */
let bootStart = performance.now();
let phase = 'warm';            // warm -> resolve -> etch -> ready -> off
let resolveDone = false;
const statusText = document.getElementById('statusText');
const led = document.getElementById('led');
const rPhase = document.getElementById('rPhase');
const rSignal = document.getElementById('rSignal');

function setStatus(txt, mode){
  statusText.innerHTML = txt;
  led.className = 'led' + (mode==='live'?' live':(mode==='go'?' go':''));
}

function ease(t){ return t<0?0 : t>1?1 : t*t*(3-2*t); }     // smoothstep

let scrollPhase = 0, noiseFrame = 0, screenDPR = 1;

function sizeScreen(){
  const r = crtEl.getBoundingClientRect();
  screenDPR = Math.min(window.devicePixelRatio||1, 2);
  screenCv.width  = Math.max(2, Math.round(r.width  * screenDPR));
  screenCv.height = Math.max(2, Math.round(r.height * screenDPR));
  sctx.imageSmoothingEnabled = true;
}

function renderScreen(now, dt){
  const elapsed = (now - bootStart)/1000;

  /* master reveal progress over the fade window */
  let p = phase==='warm' ? 0 : ease(Math.min(1, (elapsed - WARM_S) / CFG.fade));
  if (phase==='warm') p = 0;
  if (resolveDone) p = 1;

  /* transition warm -> resolve once the tube is "warm" */
  if (phase==='warm' && elapsed >= WARM_S){ phase='resolve'; }
  if (phase==='resolve' && p>=1){ resolveDone = true; phase='etch'; onResolved(); }

  if(rSignal) rSignal.textContent = Math.round(p*100)+'%';

  /* ---- 1. chromatic composite into work ---- */
  wctx.globalCompositeOperation='source-over';
  wctx.clearRect(0,0,WORKW,WORKH);
  if (logoReady){
    /* during resolve, extra aberration that settles to CFG.chroma */
    const settle = 1 - p;
    const dx = (CFG.chroma + settle*22) * (0.6 + 0.4*Math.sin(now*0.004));
    const dy = settle * 3 * Math.sin(now*0.003);
    wctx.globalCompositeOperation = 'lighter';
    wctx.drawImage(chR, dx, -dy);
    wctx.drawImage(chG, 0, 0);
    wctx.drawImage(chB, -dx, dy);
    wctx.globalCompositeOperation = 'source-over';
  }

  /* ---- 2. pixelation (resolves large->steady during fade) ---- */
  const block = Math.max(1, Math.round( (1-p)*46 + p*CFG.pixel ));
  let srcForBlit = work;
  if (block > 1){
    const lw = Math.max(1, Math.round(WORKW/block));
    const lh = Math.max(1, Math.round(WORKH/block));
    w2ctx.imageSmoothingEnabled = true;
    w2ctx.clearRect(0,0,WORKW,WORKH);
    w2ctx.drawImage(work, 0,0,WORKW,WORKH, 0,0,lw,lh);          // down (avg)
    w2ctx.imageSmoothingEnabled = false;
    w2ctx.drawImage(work2, 0,0,lw,lh, 0,0,WORKW,WORKH);          // up (blocky)
    srcForBlit = work2;
  }

  /* ---- 3. flicker dim ---- */
  const fA = CFG.flicker/100;
  const dim = 1 - fA*( 0.05 + 0.05*Math.random() + 0.03*Math.sin(now*0.05) )
                - (Math.random()<0.012*fA ? 0.25 : 0);

  /* ---- 4. blit work -> screen with horizontal granulation bands ---- */
  const SW = screenCv.width, SH = screenCv.height;
  sctx.globalCompositeOperation='source-over';
  sctx.clearRect(0,0,SW,SH);
  sctx.fillStyle='#000'; sctx.fillRect(0,0,SW,SH);
  sctx.globalAlpha = Math.max(0, Math.min(1, p*1.0 * dim));

  const gA = (CFG.gran/100);
  const sy = SH/WORKH;
  const bandPx = 3;                                   // work-space band height
  const tearChance = 0.06*gA;
  for (let wy=0; wy<WORKH; wy+=bandPx){
    const bh = Math.min(bandPx, WORKH-wy);
    /* baseline jitter + occasional big tear */
    let off = (Math.sin(wy*0.21 + now*0.006) * 1.4 + (Math.random()-0.5)*1.2) * gA * 6;
    if (Math.random() < tearChance) off += (Math.random()-0.5) * 60 * gA;
    /* extra shear while still resolving */
    off += (1-p) * Math.sin(wy*0.5 + now*0.02) * 14;
    const dxp = off * (SW/WORKW);
    sctx.drawImage(srcForBlit, 0, wy, WORKW, bh, dxp, wy*sy, SW, bh*sy);
  }
  sctx.globalAlpha = 1;

  /* ---- 5. scrolling static + cathode roll band (screen blend) ---- */
  scrollPhase += (CFG.scroll/100) * (dt||16) * 0.012;
  noiseFrame++;
  if (CFG.noise>0){
    if (noiseFrame % 2 === 0) regenNoise();
    const nA = (CFG.noise/100) * 0.18;
    sctx.globalCompositeOperation='screen';
    sctx.globalAlpha = nA;
    const oy = (scrollPhase*16) % SH;
    sctx.imageSmoothingEnabled = true;
    sctx.drawImage(noiseCv, 0, oy - SH, SW, SH);
    sctx.drawImage(noiseCv, 0, oy,       SW, SH);
    sctx.globalAlpha = 1;
  }
  /* rolling brightness band */
  {
    const rollY = ((scrollPhase*18) % (SH+SH*0.18)) - SH*0.18;
    const bandH = SH*0.16;
    const g = sctx.createLinearGradient(0, rollY, 0, rollY+bandH);
    g.addColorStop(0,   'rgba(180,225,255,0)');
    g.addColorStop(0.5, 'rgba(180,225,255,0.10)');
    g.addColorStop(1,   'rgba(180,225,255,0)');
    sctx.globalCompositeOperation='screen';
    sctx.fillStyle=g;
    sctx.fillRect(0, rollY, SW, bandH);
    sctx.globalCompositeOperation='source-over';
  }

  /* NO SIGNAL fallback */
  if (logoFailed && phase!=='warm'){
    sctx.globalCompositeOperation='source-over';
    sctx.fillStyle='rgba(255,178,74,0.9)';
    sctx.font = `${Math.round(SH*0.05)}px "Chakra Petch", monospace`;
    sctx.textAlign='center';
    sctx.fillText('NO SIGNAL', SW/2, SH*0.46);
    sctx.fillStyle='rgba(120,170,200,0.7)';
    sctx.font = `${Math.round(SH*0.026)}px "Chakra Petch", monospace`;
    sctx.fillText('place  helix_logo.png  beside this file', SW/2, SH*0.56);
  }
}

/* live scanline CSS var */
function syncScanCss(){ crtEl.style.setProperty('--scan', (CFG.scan/100*0.6).toFixed(3)); }

/* phase labels */
const WARM_S = 0.5;
function tickPhaseLabel(elapsed){
  let label;
  if (phase==='warm') label='SIGNAL ACQUIRE';
  else if (phase==='resolve') label='PHOSPHOR WARM · DECODE';
  else if (phase==='etch') label='ETCH ENTRY PROMPT';
  else if (phase==='ready') label='READY';
  else label='—';
  if(rPhase) rPhase.textContent = label;
}

/* ===================== LASER ETCH (on the tube glass) =====================
   A 4-node gantry rides the screen edges and fires converging beams onto
   the advancing burn front. The prompt is carved straight onto the CRT,
   and the glass spider-cracks outward from the cut.
   ========================================================================= */
const etchCv = document.getElementById('etch');
const ectx = etchCv.getContext('2d');
const enterBtn = document.getElementById('enterBtn');
let EW=0, EH=0, eDPR=1;

let sprHot=null, sprCool=null, sprEdge=null, textBox=null;
let sprBtnHot=null, sprBtnCool=null, sprBtnEdge=null;
let etchState = 'idle';        // idle -> tracing -> arming -> sweeping -> live
let etchStart = 0, etchDoneAt = 0;
let traceStart = 0, traceDur = 1200;
let sparks = [], smoke = [], cracks = [], flashes = [];
let nodes = [];
let crackMark = 0;
let lastEtchStatus = '';
const MAXS = 3600, MAXSM = 260, MAXCRACK = 11;

function sizeEtch(){
  const r = etchCv.getBoundingClientRect();
  eDPR = Math.min(window.devicePixelRatio||1, 2);
  EW = Math.max(2, Math.round(r.width*eDPR));
  EH = Math.max(2, Math.round(r.height*eDPR));
  etchCv.width = EW; etchCv.height = EH;
  buildEtchSprites();
  buildNodes();
}

function buildEtchSprites(){
  if (!EW) return;
  const pal = LASER_PALETTES[CFG.color];
  const fontPx = Math.round(EH*0.055);            // small relative to the big image
  const ls = Math.round(fontPx*0.16);             // tighter tracking -> compact button
  const font = `700 ${fontPx}px "Chakra Petch", monospace`;
  const blur = fontPx;

  const m = makeCv(EW,EH).getContext('2d');
  m.font=font; try{m.letterSpacing=ls+'px';}catch(e){}
  let tw;
  try { tw = m.measureText(ENTER_TEXT).width; }
  catch(e){ tw = m.measureText(ENTER_TEXT).width; }
  if (!tw || tw < 10) tw = fontPx*ENTER_TEXT.length*0.6;
  const cx = EW/2, cy = EH*0.5;                    // dead center of the image
  textBox = { x: cx - tw/2, w: tw, cx, cy, fontPx };

  /* rectangular button carved around the prompt */
  const padX = fontPx*1.0, padY = fontPx*0.62;
  const bw = tw + padX*2, bh = fontPx + padY*2;
  const bx = cx - bw/2, by = cy - bh/2;
  textBox.btn = { x:bx, y:by, w:bw, h:bh };

  const buildPoly = (pts)=>{ const cum=[0]; let t=0;
    for(let i=1;i<pts.length;i++){ t+=Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y); cum.push(t); }
    return {pts,cum,total:t||1}; };

  textBox.border = buildPoly([
    {x:bx,y:by},{x:bx+bw,y:by},{x:bx+bw,y:by+bh},{x:bx,y:by+bh},{x:bx,y:by}
  ]);

  /* inner fill = randomized slanted scratch strokes (hand-scratched feel) */
  const inx=bx+fontPx*0.5, iny=by+fontPx*0.34, inw=bw-fontPx*1.0, inh=bh-fontPx*0.68;
  const slant=-0.5, sp=fontPx*0.42;               // base slant + spacing
  const scr=[];
  for (let yy=iny; yy<=iny+inh; yy+=sp){
    for (let xx=inx; xx<=inx+inw; xx+=sp){
      const len=fontPx*(0.45+Math.random()*0.7);
      const a=slant+(Math.random()-0.5)*0.55;
      const ox=xx+(Math.random()-0.5)*sp*0.7, oy=yy+(Math.random()-0.5)*sp*0.7;
      let x1=ox-Math.cos(a)*len/2, y1=oy-Math.sin(a)*len/2;
      let x2=ox+Math.cos(a)*len/2, y2=oy+Math.sin(a)*len/2;
      x1=Math.max(bx+2,Math.min(bx+bw-2,x1)); x2=Math.max(bx+2,Math.min(bx+bw-2,x2));
      y1=Math.max(by+2,Math.min(by+bh-2,y1)); y2=Math.max(by+2,Math.min(by+bh-2,y2));
      scr.push({x1,y1,x2,y2});
    }
  }
  scr.sort((a,b)=>(a.x1+a.y1)-(b.x1+b.y1));        // carve across diagonally
  textBox.scratch = scr;

  const base = (draw)=>{ const c=makeCv(EW,EH); const g=c.getContext('2d');
    g.font=font; try{g.letterSpacing=ls+'px';}catch(e){}
    g.textAlign='center'; g.textBaseline='middle'; g.lineJoin='round'; g.lineCap='round';
    draw(g); return c; };

  /* readable prompt: white core lifted off the glowing infill by a dark
     engraved contour, with a thin laser-color rim for theme cohesion.
     Drawn with source-over (not additive) so the dark contour separates it. */
  sprCool = base(g=>{
    // burned-back separation halo
    g.shadowColor='rgba(2,6,10,0.7)'; g.shadowBlur=blur*0.4;
    g.lineJoin='round'; g.lineWidth=fontPx*0.30; g.strokeStyle='rgba(3,7,11,0.96)';
    g.strokeText(ENTER_TEXT,cx,cy);
    // crisp dark contour
    g.shadowBlur=0; g.lineWidth=fontPx*0.16; g.strokeStyle='rgba(3,7,11,0.98)';
    g.strokeText(ENTER_TEXT,cx,cy);
    // thin laser-color rim
    g.lineWidth=fontPx*0.06; g.strokeStyle=pal.hot2;
    g.strokeText(ENTER_TEXT,cx,cy);
    // white core
    g.fillStyle='#ffffff'; g.fillText(ENTER_TEXT,cx,cy);
  });
  sprHot = base(g=>{
    g.shadowColor=pal.glow; g.shadowBlur=blur*0.5; g.fillStyle=pal.hot; g.fillText(ENTER_TEXT,cx,cy);
    g.shadowBlur=0; g.fillStyle=pal.hot2; g.fillText(ENTER_TEXT,cx,cy);
  });
  sprEdge = base(g=>{
    g.shadowColor=pal.hot;  g.shadowBlur=blur*1.4; g.lineWidth=fontPx*0.13; g.strokeStyle=pal.hot;  g.strokeText(ENTER_TEXT,cx,cy);
    g.shadowColor=pal.glow; g.shadowBlur=blur*0.7; g.lineWidth=fontPx*0.08; g.strokeStyle=pal.hot;  g.strokeText(ENTER_TEXT,cx,cy);
    g.shadowBlur=blur*0.28; g.lineWidth=fontPx*0.05; g.strokeStyle=pal.hot2; g.strokeText(ENTER_TEXT,cx,cy);
    g.shadowColor='rgba(255,255,255,0.95)'; g.shadowBlur=4; g.lineWidth=fontPx*0.03; g.strokeStyle='#fff'; g.strokeText(ENTER_TEXT,cx,cy);
    g.shadowBlur=0; g.lineWidth=1; g.strokeText(ENTER_TEXT,cx,cy);
  });
}

/* 4 laser nodes on the screen edges */
function buildNodes(){
  if (!textBox) return;
  nodes = [
    { edge:'top',    pos:textBox.x,            park:textBox.x,            follow:0.18, lit:false },
    { edge:'bottom', pos:textBox.x+textBox.w,  park:textBox.x+textBox.w,  follow:0.18, lit:false },
    { edge:'left',   pos:textBox.cy,           park:textBox.cy,           follow:0.26, lit:false },
    { edge:'right',  pos:textBox.cy,           park:textBox.cy,           follow:0.26, lit:false },
  ];
}
function nodePoint(n){
  switch(n.edge){
    case 'top':    return {x:n.pos, y:6*eDPR};
    case 'bottom': return {x:n.pos, y:EH-6*eDPR};
    case 'left':   return {x:6*eDPR, y:n.pos};
    case 'right':  return {x:EW-6*eDPR, y:n.pos};
  }
}

/* ---- pre-etch aperture trace: a light head runs the screen perimeter,
   then the trail collapses and the 4 edge nodes ignite and start cutting ---- */
function startTrace(){
  if (!textBox || !sprCool){ sizeEtch(); }
  if (!textBox){ setTimeout(startTrace, 120); return; }
  etchState='tracing';
  traceStart=performance.now();
  traceDur = 2200/CFG.etch;
  buildNodes();
  sparks.length=0; smoke.length=0; cracks.length=0; flashes.length=0;
  enterBtn.classList.remove('live'); enterBtn.style.opacity=0;
  setStatus('Tracing aperture&hellip;', 'go');
}
function perimeterLoop(){
  const i=6*eDPR;
  return [ {x:i,y:i},{x:EW-i,y:i},{x:EW-i,y:EH-i},{x:i,y:EH-i},{x:i,y:i} ]; // TL TR BR BL TL
}
function renderTrace(now){
  const pal=LASER_PALETTES[CFG.color];
  const t=Math.min(1,(now-traceStart)/traceDur);
  const loop=perimeterLoop();
  const seg=[]; let tot=0;
  for(let k=0;k<4;k++){ const d=Math.hypot(loop[k+1].x-loop[k].x, loop[k+1].y-loop[k].y); seg.push(d); tot+=d; }
  const headL=t*tot;

  // arc-length of an edge point measured along the loop (for node-pass timing)
  const arcLen=(pt)=>{ let acc=0;
    for(let k=0;k<4;k++){ const a=loop[k],b=loop[k+1];
      const dx=b.x-a.x, dy=b.y-a.y, L2=(dx*dx+dy*dy)||1;
      const u=((pt.x-a.x)*dx+(pt.y-a.y)*dy)/L2;
      const px=a.x+dx*u, py=a.y+dy*u;
      if(u>=-0.01 && u<=1.01 && Math.hypot(pt.x-px,pt.y-py) < 8*eDPR) return acc+u*Math.sqrt(L2);
      acc+=seg[k];
    } return acc; };

  // progressive aperture outline, drawn up to the head (stays lit through the lap)
  ectx.globalCompositeOperation='lighter'; ectx.lineCap='round'; ectx.lineJoin='round';
  let acc=0, head=loop[0];
  ectx.beginPath(); ectx.moveTo(loop[0].x,loop[0].y);
  for(let k=0;k<4;k++){
    if(acc+seg[k]<=headL){ ectx.lineTo(loop[k+1].x,loop[k+1].y); head=loop[k+1]; }
    else { const p=seg[k]?(headL-acc)/seg[k]:0;
      head={x:loop[k].x+(loop[k+1].x-loop[k].x)*p, y:loop[k].y+(loop[k+1].y-loop[k].y)*p};
      ectx.lineTo(head.x,head.y); break; }
    acc+=seg[k];
  }
  ectx.strokeStyle=pal.glow;  ectx.globalAlpha=0.45; ectx.lineWidth=6*eDPR; ectx.stroke();
  ectx.strokeStyle=pal.hot2;  ectx.globalAlpha=0.85; ectx.lineWidth=2*eDPR; ectx.stroke();
  ectx.strokeStyle='#ffffff'; ectx.globalAlpha=0.9;  ectx.lineWidth=1*eDPR; ectx.stroke();

  // bright traveling head
  const hg=ectx.createRadialGradient(head.x,head.y,0,head.x,head.y,15*eDPR);
  hg.addColorStop(0,'rgba(255,255,245,1)'); hg.addColorStop(0.4,pal.glow); hg.addColorStop(1,'rgba(0,0,0,0)');
  ectx.globalAlpha=1; ectx.fillStyle=hg;
  ectx.beginPath(); ectx.arc(head.x,head.y,15*eDPR,0,7); ectx.fill();

  // nodes stay dark until the sweep reaches them, then ignite and stay lit
  for(const n of nodes){
    const p=nodePoint(n);
    if(!n.lit && headL >= arcLen(p)){ n.lit=true; spawnFlash(p.x,p.y,EW*0.04); spawnSparks(p.x,p.y,9,1.0); }
    if(n.lit) drawNode(p, 1, pal);
  }
  ectx.globalAlpha=1; ectx.globalCompositeOperation='source-over';

  if (t>=1){ etchState='arming'; armStart=now; setStatus('Nodes armed&hellip;','go'); }   // revolution closed -> flash, then fire
}

function startEtch(){
  if (!textBox || !sprCool){ sizeEtch(); }
  if (!textBox){ setTimeout(startEtch, 120); return; }
  etchState='sweeping';
  etchStart=performance.now();
  sparks.length=0; smoke.length=0; cracks.length=0; flashes.length=0;
  crackMark=-1; lastEtchStatus='';
  buildNodes();
  enterBtn.classList.remove('live'); enterBtn.style.opacity=0;
  setStatus('Carving entry prompt&hellip;', 'go');
}

function spawnSparks(x,y,n,power){
  power = power||1;
  for(let i=0;i<n;i++){
    if(sparks.length>=MAXS) sparks.shift();
    // launch in an upward fan: sparks shoot up/out, gravity arcs them back down
    const a = -Math.PI/2 + (Math.random()-0.5)*2.0;     // cone centered straight up
    const s = (1.2+Math.random()*5.5)*power*eDPR;
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,  // vy<0 = upward
      g:(0.30+Math.random()*0.16)*eDPR,                  // per-spark gravity
      life:1,decay:0.010+Math.random()*0.022,
      sz:(0.7+Math.random()*1.8)*eDPR,blue:Math.random()<0.4});
  }
}
function spawnSmoke(x,y,n){
  for(let i=0;i<n;i++){
    if(smoke.length>=MAXSM) break;
    smoke.push({x:x+(Math.random()-0.5)*10*eDPR,y,vx:(Math.random()-0.5)*0.35*eDPR,
      vy:-(0.3+Math.random()*0.7)*eDPR,r:(5+Math.random()*11)*eDPR,life:1,
      decay:0.005+Math.random()*0.006,warm:Math.random()<0.55});
  }
}
function spawnFlash(x,y,r){ flashes.push({x,y,r:r*eDPR,life:1}); }

/* ---- glass cracks: branching fracture trees that grow over time ---- */
function makeCrack(ox, oy, scale, dirBias, opts){
  opts = opts || {};
  const segs=[]; let total=0;
  const branches = opts.branches || (2 + (Math.random()*3|0));
  const subProb  = (opts.subProb!=null) ? opts.subProb : 0.16;
  for (let b=0;b<branches;b++){
    let ang = (dirBias!=null) ? dirBias + (Math.random()-0.5)*1.7 : Math.random()*Math.PI*2;
    let x=ox, y=oy;
    const steps = (opts.long?15:8) + (Math.random()*9|0);
    for (let s=0;s<steps;s++){
      ang += (Math.random()-0.5)*0.9;
      const len = EW*scale*(0.018+Math.random()*0.05);
      let nx = x + Math.cos(ang)*len, ny = y + Math.sin(ang)*len;
      nx=Math.max(2,Math.min(EW-2,nx)); ny=Math.max(2,Math.min(EH-2,ny));
      const d=Math.hypot(nx-x,ny-y);
      segs.push({ax:x,ay:y,bx:nx,by:ny,len:d}); total+=d;
      x=nx; y=ny;
      if (Math.random()<subProb){            // single short sub-branch
        let a2=ang+(Math.random()-0.5)*1.6, x2=x, y2=y;
        const st2=3+(Math.random()*4|0);
        for (let k=0;k<st2;k++){
          a2+=(Math.random()-0.5)*0.9;
          const l2=EW*scale*(0.012+Math.random()*0.03);
          let mx=Math.max(2,Math.min(EW-2,x2+Math.cos(a2)*l2));
          let my=Math.max(2,Math.min(EH-2,y2+Math.sin(a2)*l2));
          const d2=Math.hypot(mx-x2,my-y2);
          segs.push({ax:x2,ay:y2,bx:mx,by:my,len:d2}); total+=d2;
          x2=mx; y2=my;
        }
      }
    }
  }
  return { segs, total, grow:0, growMs: opts.growMs || (380+Math.random()*260), born:performance.now() };
}
function spawnCrack(x,y,scale,dirBias,opts){
  if (cracks.length>=MAXCRACK) cracks.shift();
  cracks.push(makeCrack(x,y,scale,dirBias,opts));
  spawnFlash(x,y, EW*0.05);
}

function drawCracks(now, dt){
  if (!cracks.length) return;
  for (const c of cracks){
    c.grow = Math.min(1, c.grow + dt/c.growMs);
    const drawn = c.grow*c.total;
    const age = (now-c.born);
    const heat = Math.max(0, 1 - age/900);        // hot tip cools
    let acc=0;
    // wide cool glow
    ectx.globalCompositeOperation='lighter';
    ectx.lineCap='round'; ectx.lineJoin='round';
    for (const s of c.segs){
      if (acc>drawn) break;
      const p = Math.min(1,(drawn-acc)/s.len);
      const bx=s.ax+(s.bx-s.ax)*p, by=s.ay+(s.by-s.ay)*p;
      ectx.strokeStyle='rgba(120,200,255,0.10)';
      ectx.lineWidth=3.2*eDPR; ectx.globalAlpha=0.9;
      ectx.beginPath(); ectx.moveTo(s.ax,s.ay); ectx.lineTo(bx,by); ectx.stroke();
      ectx.strokeStyle='rgba(225,248,255,0.95)';
      ectx.lineWidth=1.0*eDPR; ectx.globalAlpha=0.95;
      ectx.beginPath(); ectx.moveTo(s.ax,s.ay); ectx.lineTo(bx,by); ectx.stroke();
      acc+=s.len;
    }
    // hot frontier while young
    if (heat>0.02 && c.grow<1){
      const pal=LASER_PALETTES[CFG.color];
      ectx.globalAlpha=heat;
      ectx.strokeStyle=`rgba(${pal.flare[0]},${pal.flare[1]},${pal.flare[2]},0.6)`;
      ectx.lineWidth=2.0*eDPR;
      acc=0;
      for (const s of c.segs){
        if (acc>drawn) break;
        if (drawn-acc < s.len){
          const p=Math.min(1,(drawn-acc)/s.len);
          const bx=s.ax+(s.bx-s.ax)*p, by=s.ay+(s.by-s.ay)*p;
          ectx.beginPath(); ectx.moveTo(s.ax,s.ay); ectx.lineTo(bx,by); ectx.stroke();
        }
        acc+=s.len;
      }
    }
  }
  ectx.globalAlpha=1; ectx.globalCompositeOperation='source-over';
}

function drawNode(p, a, pal){
  ectx.globalCompositeOperation='lighter';
  ectx.globalAlpha=a;
  ectx.fillStyle=pal.glow; ectx.beginPath(); ectx.arc(p.x,p.y,8*eDPR,0,7); ectx.fill();
  ectx.fillStyle='rgba(255,235,200,0.95)'; ectx.beginPath(); ectx.arc(p.x,p.y,3.6*eDPR,0,7); ectx.fill();
  ectx.fillStyle='rgba(255,255,245,1)'; ectx.beginPath(); ectx.arc(p.x,p.y,1.7*eDPR,0,7); ectx.fill();
  ectx.globalAlpha=1;
}

function drawBeam(sx,sy,tx,ty,strobe,pal){
  ectx.globalCompositeOperation='lighter';
  ectx.lineCap='round';
  ectx.strokeStyle=pal.beam; ectx.lineWidth=7*eDPR; ectx.globalAlpha=0.14*strobe;
  ectx.beginPath(); ectx.moveTo(sx,sy); ectx.lineTo(tx,ty); ectx.stroke();
  ectx.strokeStyle='rgb(120,200,255)'; ectx.lineWidth=2.4*eDPR; ectx.globalAlpha=0.7*strobe;
  ectx.beginPath(); ectx.moveTo(sx,sy); ectx.lineTo(tx,ty); ectx.stroke();
  ectx.strokeStyle='rgb(255,255,245)'; ectx.lineWidth=1.0*eDPR; ectx.globalAlpha=strobe;
  ectx.beginPath(); ectx.moveTo(sx,sy); ectx.lineTo(tx,ty); ectx.stroke();
  ectx.globalAlpha=1;
}

/* ---- tool-path carving helpers ---- */
function ptAtLen(path, L){
  let acc=0;
  for(let i=0;i<path.pts.length-1;i++){
    const seg=path.cum[i+1]-path.cum[i];
    if(acc+seg>=L){ const t=seg?(L-acc)/seg:0; const a=path.pts[i],b=path.pts[i+1];
      return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
    acc+=seg;
  }
  const last=path.pts[path.pts.length-1]; return {x:last.x,y:last.y};
}
function strokeUpTo(path, L, w, style, alpha){
  ectx.lineWidth=w; ectx.strokeStyle=style; ectx.globalAlpha=alpha;
  ectx.beginPath(); ectx.moveTo(path.pts[0].x, path.pts[0].y);
  let acc=0;
  for(let i=0;i<path.pts.length-1;i++){
    const a=path.pts[i], b=path.pts[i+1], seg=path.cum[i+1]-path.cum[i];
    if(acc+seg<=L){ ectx.lineTo(b.x,b.y); }
    else { const t=seg?(L-acc)/seg:0; ectx.lineTo(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t); ectx.stroke(); return; }
    acc+=seg;
  }
  ectx.stroke();
}
function drawCarved(path, frac, amul){
  amul = amul==null?1:amul;
  const pal = LASER_PALETTES[CFG.color];
  const L = Math.max(0,Math.min(1,frac))*path.total;
  ectx.globalCompositeOperation='lighter'; ectx.lineCap='round'; ectx.lineJoin='round';
  const w = Math.max(3*eDPR, textBox.fontPx*0.16);
  strokeUpTo(path, L, w*3.0, pal.glow,  0.55*amul);
  strokeUpTo(path, L, w*1.7, pal.beam,  0.5*amul);
  strokeUpTo(path, L, w,     pal.hot2,  0.95*amul);
  strokeUpTo(path, L, Math.max(1,w*0.36), '#ffffff', 0.95*amul);
  ectx.globalAlpha=1; ectx.globalCompositeOperation='source-over';
  return ptAtLen(path, L);
}

/* randomized slanted scratch strokes, carved up to `frac` */
function drawScratches(frac, amul){
  amul = amul==null?1:amul;
  const pal=LASER_PALETTES[CFG.color];
  const arr=textBox.scratch||[]; const n=arr.length;
  const upto=Math.max(0,Math.min(1,frac))*n, full=Math.floor(upto);
  const w=Math.max(1.3*eDPR, textBox.fontPx*0.05);
  ectx.globalCompositeOperation='lighter'; ectx.lineCap='round';
  let head=null;
  for(let i=0;i<n && i<=full;i++){
    const s=arr[i]; let ex=s.x2, ey=s.y2;
    if(i===full && full<n){ const t=upto-full; ex=s.x1+(s.x2-s.x1)*t; ey=s.y1+(s.y2-s.y1)*t; head={x:ex,y:ey}; }
    ectx.strokeStyle=pal.glow; ectx.globalAlpha=0.28*amul; ectx.lineWidth=w*2.4;
    ectx.beginPath(); ectx.moveTo(s.x1,s.y1); ectx.lineTo(ex,ey); ectx.stroke();
    ectx.strokeStyle=pal.hot2; ectx.globalAlpha=0.85*amul; ectx.lineWidth=w;
    ectx.beginPath(); ectx.moveTo(s.x1,s.y1); ectx.lineTo(ex,ey); ectx.stroke();
    ectx.strokeStyle='#ffffff'; ectx.globalAlpha=0.5*amul; ectx.lineWidth=Math.max(1,w*0.4);
    ectx.beginPath(); ectx.moveTo(s.x1,s.y1); ectx.lineTo(ex,ey); ectx.stroke();
  }
  ectx.globalAlpha=1; ectx.globalCompositeOperation='source-over';
  if(head==null && full>=n && n>0){ const s=arr[n-1]; head={x:s.x2,y:s.y2}; }
  return head;
}

/* shared particle pass (flashes / sparks / smoke) — runs every phase */
function renderParticles(){
  const pal=LASER_PALETTES[CFG.color];
  for(let i=flashes.length-1;i>=0;i--){ const fl=flashes[i]; fl.life-=0.06;
    if(fl.life<=0){flashes.splice(i,1);continue;}
    const rg=ectx.createRadialGradient(fl.x,fl.y,0,fl.x,fl.y,fl.r*(1.2-fl.life));
    rg.addColorStop(0,`rgba(220,240,255,${0.5*fl.life})`); rg.addColorStop(1,'rgba(0,0,0,0)');
    ectx.globalCompositeOperation='lighter'; ectx.fillStyle=rg;
    ectx.beginPath(); ectx.arc(fl.x,fl.y,fl.r*(1.2-fl.life),0,7); ectx.fill();
  }
  ectx.globalCompositeOperation='lighter'; ectx.lineCap='round';
  for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i];
    s.vx*=0.99; s.vy+=(s.g||0.3*eDPR);          // air drag + gravity (arc down)
    const px=s.x, py=s.y;                         // prev pos -> motion streak
    s.x+=s.vx; s.y+=s.vy; s.life-=s.decay;
    if(s.life<=0){sparks.splice(i,1);continue;}
    const col=s.blue?'150,210,255':`${pal.flare[0]},${pal.flare[1]},${pal.flare[2]}`;
    ectx.globalAlpha=s.life*0.8;                  // streak: length scales with speed
    ectx.strokeStyle=`rgba(${col},1)`; ectx.lineWidth=s.sz;
    ectx.beginPath(); ectx.moveTo(px,py); ectx.lineTo(s.x,s.y); ectx.stroke();
    ectx.globalAlpha=s.life;                      // bright head
    ectx.fillStyle=`rgba(${col},1)`;
    ectx.fillRect(s.x-s.sz*0.5,s.y-s.sz*0.5,s.sz,s.sz);
  }
  ectx.globalAlpha=1;
  for(let i=smoke.length-1;i>=0;i--){ const m=smoke[i]; m.x+=m.vx;m.y+=m.vy;m.vy*=0.992;m.r*=1.012;m.life-=m.decay;
    if(m.life<=0){smoke.splice(i,1);continue;}
    const col=m.warm?'255,180,110':'190,200,215';
    const rg=ectx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r);
    rg.addColorStop(0,`rgba(${col},${0.16*m.life})`); rg.addColorStop(1,`rgba(${col},0)`);
    ectx.globalCompositeOperation='source-over'; ectx.fillStyle=rg;
    ectx.beginPath(); ectx.arc(m.x,m.y,m.r,0,7); ectx.fill();
  }
  ectx.globalAlpha=1; ectx.globalCompositeOperation='source-over';
}

/* armed beat: the lit nodes flash for ARM_MS before they fire */
const ARM_MS = 2000;
let armStart = 0;
function renderArm(now){
  const pal=LASER_PALETTES[CFG.color];
  const t=Math.min(1,(now-armStart)/ARM_MS);
  // persistent aperture outline (carried over from the trace)
  const loop=perimeterLoop();
  ectx.globalCompositeOperation='lighter'; ectx.lineCap='round'; ectx.lineJoin='round';
  ectx.beginPath(); ectx.moveTo(loop[0].x,loop[0].y);
  for(let k=1;k<loop.length;k++) ectx.lineTo(loop[k].x,loop[k].y);
  ectx.strokeStyle=pal.glow; ectx.globalAlpha=0.30; ectx.lineWidth=6*eDPR; ectx.stroke();
  ectx.strokeStyle=pal.hot2; ectx.globalAlpha=0.55; ectx.lineWidth=2*eDPR; ectx.stroke();
  // nodes flash ~4 times, building toward the fire
  const pulse=Math.abs(Math.sin(t*Math.PI*4));
  const amp=Math.min(1, 0.35 + 0.7*pulse*(0.5+0.5*t));
  for(const n of nodes){ const p=nodePoint(n);
    const r=(10+20*pulse)*eDPR;
    const g=ectx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    g.addColorStop(0,`rgba(255,255,245,${amp})`); g.addColorStop(0.5,pal.glow); g.addColorStop(1,'rgba(0,0,0,0)');
    ectx.globalCompositeOperation='lighter'; ectx.globalAlpha=amp; ectx.fillStyle=g;
    ectx.beginPath(); ectx.arc(p.x,p.y,r,0,7); ectx.fill();
    drawNode(p, amp, pal);
    if(pulse>0.85 && Math.random()<0.35) spawnSparks(p.x,p.y, Math.round(4*CFG.sparks), 0.8);
  }
  ectx.globalAlpha=1; ectx.globalCompositeOperation='source-over';
  if(t>=1){ startEtch(); }   // armed -> fire
}

function renderEtch(now, dt){
  if (!EW) return;
  dt = dt || 16;
  ectx.clearRect(0,0,EW,EH);
  if (!sprCool || !textBox.border) return;
  const pal = LASER_PALETTES[CFG.color];

  drawCracks(now, dt);

  // idle: nothing carved yet — keep the glass clean until the laser starts
  if (etchState==='idle'){ return; }
  // pre-etch: aperture light-trace runs the perimeter, then breaks into the nodes
  if (etchState==='tracing'){ renderTrace(now); renderParticles(); return; }
  // armed: nodes flash for 2s before firing
  if (etchState==='arming'){ renderArm(now); renderParticles(); return; }

  // staged carve: border -> scratch infill -> text
  const D = (4800/CFG.etch);
  const f = etchState==='live' ? 1 : Math.min(1,(now-etchStart)/D);
  const B=0.22, H=0.60;
  let stage='', sf=0, head=null, label='';
  const strobe = 0.6+0.4*Math.sin(now*0.05);

  // completed stages persist (glowing)
  if (f>=B || etchState==='live') drawCarved(textBox.border, 1);
  if (f>=H || etchState==='live') drawScratches(1, 0.9);

  if (etchState!=='live'){
    if (f < B){ stage='border'; sf=f/B; label='Carving border&hellip;'; head=drawCarved(textBox.border, sf); }
    else if (f < H){ stage='scratch'; sf=(f-B)/(H-B); label='Scratching infill&hellip;'; head=drawScratches(sf, 0.9); }
    else { stage='text'; sf=(f-H)/(1-H); label='Etching prompt&hellip;';
      const fx = textBox.x + sf*textBox.w;
      // jitter the cutting head so it reads as actively burning the letters
      const jx=(Math.random()-0.5)*textBox.fontPx*0.16;
      const jy=(Math.random()-0.5)*textBox.fontPx*0.30;
      head={x:fx+jx, y:textBox.cy+jy};
      ectx.save(); ectx.beginPath(); ectx.rect(0,0,fx+2,EH); ectx.clip();
      ectx.globalCompositeOperation='source-over'; ectx.drawImage(sprCool,0,0); ectx.restore();
      const win=textBox.fontPx*1.2;
      ectx.save(); ectx.beginPath(); ectx.rect(fx-win+jx,0,win+6,EH); ectx.clip();
      ectx.globalCompositeOperation='lighter'; ectx.globalAlpha=0.95; ectx.drawImage(sprHot,jx,jy*0.5);
      ectx.globalAlpha=1; ectx.drawImage(sprEdge,jx,jy*0.5); ectx.restore();
    }
    if(label && label!==lastEtchStatus){ setStatus(label,'go'); lastEtchStatus=label; }
  } else {
    ectx.globalCompositeOperation='source-over'; ectx.drawImage(sprCool,0,0);
  }

  // working head: bloom + converging nodes + sparks
  if (head && etchState!=='live'){
    const fl = CFG.flare;                       // flare-intensity multiplier
    const R  = textBox.fontPx*1.7*(0.85+0.5*fl);
    ectx.globalCompositeOperation='lighter';
    // (1) wide outer halo — the part that makes the point read brighter/hotter
    const halo=ectx.createRadialGradient(head.x,head.y,0,head.x,head.y,R*1.85);
    halo.addColorStop(0,`rgba(${pal.flare[0]},${pal.flare[1]},${pal.flare[2]},${Math.min(1,0.30*fl)})`);
    halo.addColorStop(1,'rgba(0,0,0,0)');
    ectx.fillStyle=halo; ectx.fillRect(head.x-R*1.85, head.y-R*1.85, R*3.7, R*3.7);
    // (2) primary bloom
    const g=ectx.createRadialGradient(head.x,head.y,0,head.x,head.y,R);
    g.addColorStop(0,'rgba(255,255,250,1)');
    g.addColorStop(0.14,'rgba(255,255,238,1)');
    g.addColorStop(0.34,`rgba(${pal.flare[0]},${pal.flare[1]},${pal.flare[2]},${Math.min(1,0.85*fl)})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ectx.fillStyle=g; ectx.fillRect(head.x-R, head.y-R, R*2, R*2);
    // (3) white-hot core — additive stacks; brighter flare => more stacks
    const cr=textBox.fontPx*0.55*(0.9+0.35*fl);
    const core=ectx.createRadialGradient(head.x,head.y,0,head.x,head.y,cr);
    core.addColorStop(0,'rgba(255,255,255,1)'); core.addColorStop(0.5,'rgba(255,255,255,0.9)'); core.addColorStop(1,'rgba(255,255,255,0)');
    ectx.fillStyle=core;
    const cores = 2 + Math.round(fl);
    for(let s=0;s<cores;s++){ const k=1-s*0.30; ectx.beginPath(); ectx.arc(head.x,head.y,cr*Math.max(0.18,k),0,7); ectx.fill(); }
    // (4) anamorphic streak — horizontal lens-flare line, the classic "intense" tell
    const sl=R*2.4;
    const streak=ectx.createLinearGradient(head.x-sl,head.y,head.x+sl,head.y);
    streak.addColorStop(0,'rgba(0,0,0,0)');
    streak.addColorStop(0.5,`rgba(255,255,250,${Math.min(1,0.5*fl)})`);
    streak.addColorStop(1,'rgba(0,0,0,0)');
    ectx.fillStyle=streak;
    const sh=Math.max(1.2*eDPR, textBox.fontPx*0.06*fl);
    ectx.fillRect(head.x-sl, head.y-sh/2, sl*2, sh);
    for(const n of nodes){
      const tgt=(n.edge==='top'||n.edge==='bottom')?head.x:head.y;
      n.pos += (tgt-n.pos)*n.follow;
      const p=nodePoint(n); drawBeam(p.x,p.y,head.x,head.y,strobe,pal); drawNode(p,1,pal);
    }
    spawnSparks(head.x,head.y, Math.round((stage==='scratch'?34:60)*CFG.sparks), stage==='border'?1.3:1.0);
    if(Math.random()<0.7) spawnSmoke(head.x,head.y,1);
    if (f - crackMark > 0.14){
      crackMark=f;
      spawnCrack(head.x,head.y,0.5+Math.random()*0.4,(Math.random()-0.5)*6.28);
      spawnSparks(head.x,head.y,Math.round(80*CFG.sparks),1.4);
    }
  }

  // complete -> live
  if (etchState==='sweeping' && f>=1){
    etchState='live'; etchDoneAt=now;
    const b=textBox.btn;
    // a couple of slow, clean fractures creeping from opposite corners out to the screen edges
    const slow = { growMs: 2800+Math.random()*1500, long:true, branches:1+(Math.random()*2|0), subProb:0.05 };
    const corners=[[b.x,b.y],[b.x+b.w,b.y+b.h]];   // two diagonal corners only
    for (const [cxp,cyp] of corners){
      const ang = Math.atan2(cyp-EH/2, cxp-EW/2);   // outward, toward the nearest screen corner
      spawnCrack(cxp,cyp,1.5,ang,slow);
    }
    spawnSparks(textBox.cx,textBox.cy,Math.round(70*CFG.sparks),2.0); spawnFlash(textBox.cx,textBox.cy,EW*0.2);
    onEtchDone();
  }

  renderParticles();

  // live: retract nodes; border + scratches + text keep glowing; caret blinks
  if (etchState==='live'){
    const na=Math.max(0,1-(now-etchDoneAt)/900);
    if(na>0){ for(const n of nodes){ n.pos+=(n.park-n.pos)*0.12; drawNode(nodePoint(n),na*0.7,pal); } }
    const pulse=0.82+0.18*Math.sin(now*0.004); const hover=enterBtn.matches(':hover');
    drawCarved(textBox.border, 1, (hover?1.0:0.85)*pulse);
    ectx.globalCompositeOperation='lighter';
    ectx.globalAlpha=(hover?0.5:0.28)*pulse; ectx.drawImage(sprEdge,0,0);
    if(Math.sin(now*0.006)>-0.2){
      ectx.globalAlpha=hover?0.95:0.6; ectx.fillStyle=pal.hot2;
      const cx0=textBox.x+textBox.w+textBox.fontPx*0.3;
      ectx.fillRect(cx0,textBox.cy-textBox.fontPx*0.46,textBox.fontPx*0.1,textBox.fontPx*0.92);
    }
    ectx.globalAlpha=1; ectx.globalCompositeOperation='source-over';
  }
}


/* ===================== ORCHESTRATION ===================== */
function onResolved(){ setStatus('Logo resolved', 'go'); setTimeout(startTrace, Math.max(0,CFG.hold)*1000); }
function onEtchDone(){
  phase='ready';
  enterBtn.classList.add('live');
  enterBtn.style.opacity = 1;            // becomes interactive (still visually transparent)
  setStatus('Ready &mdash; <b>press to enter</b>', 'live');
}

let lastT = performance.now();
let etchErrLogged = false;
function loop(now){
  const dt = now - lastT; lastT = now;
  try { renderScreen(now, dt); } catch(e){ /* keep looping */ }
  try { renderEtch(now, dt); }
  catch(e){ if(!etchErrLogged){ console.error('etch render error:', e); etchErrLogged=true; } }
  try { tickPhaseLabel((now-bootStart)/1000); } catch(e){}
  requestAnimationFrame(loop);
}

/* enter / boot transition */
enterBtn.addEventListener('click', ()=>{
  if (etchState!=='live') return;
  crtEl.classList.add('surge-on');
  setStatus('Entering&hellip;', 'live');
  setTimeout(()=>{
    crtEl.classList.remove('surge-on');
    crtEl.classList.add('off');
    setStatus('Connected', 'live');
    // (wire your route here) e.g. window.location.href = 'app.html';
  }, 120);
  setTimeout(()=>{ window.location.href = 'app.html'; }, 600);
});

function replayBoot(){
  crtEl.classList.remove('off','surge-on');
  bootStart = performance.now();
  phase='warm'; resolveDone=false;
  etchState='idle'; lastEtchStatus=''; etchDoneAt=0; crackMark=0;
  enterBtn.classList.remove('live'); enterBtn.style.opacity=0;
  sparks.length=0; smoke.length=0; cracks.length=0; flashes.length=0;
  buildNodes();
  // wipe both canvases so nothing from the previous run lingers
  ectx.clearRect(0,0,EW,EH);
  sctx.clearRect(0,0,screenCv.width,screenCv.height);
  sctx.fillStyle='#000'; sctx.fillRect(0,0,screenCv.width,screenCv.height);
  setStatus('Cold start', '');
}

/* jump straight to the finished, interactive "ready" state */
function skipBoot(){
  if (!textBox){ sizeEtch(); }
  if (!textBox){ setTimeout(skipBoot, 80); return; }   // wait for layout, then skip
  crtEl.classList.remove('off','surge-on');
  resolveDone = true; phase='etch';
  etchState='live'; etchDoneAt=performance.now(); crackMark=0;
  sparks.length=0; smoke.length=0; cracks.length=0; flashes.length=0;
  buildNodes();
  // paint the completed frame once: full border + scratches + cooled text sprite
  ectx.clearRect(0,0,EW,EH);
  drawCarved(textBox.border, 1);
  drawScratches(1, 0.9);
  if (sprCool){ ectx.globalCompositeOperation='source-over'; ectx.drawImage(sprCool,0,0); }
  onEtchDone();                                          // arms the enter button
}

/* animation controls */
(function(){
  const sb=document.getElementById('skipBtn'), rb=document.getElementById('replayBtn');
  if(sb) sb.addEventListener('click', skipBoot);
  if(rb) rb.addEventListener('click', replayBoot);
})();

/* ===================== RESIZE + BOOT ===================== */
function sizeAll(){ sizeScreen(); sizeEtch(); }
window.addEventListener('resize', ()=>{ clearTimeout(window.__rz); window.__rz=setTimeout(sizeAll,120); });

/* load logo */
const limg = new Image();
limg.onload = ()=>{ logo=limg; buildChannels(); logoReady=true; };
limg.onerror = ()=>{ logoFailed=true; logoReady=false; var _rs=document.getElementById('rSource'); if(_rs) _rs.textContent='logo — MISSING'; };
limg.src = LOGO_SRC;

syncScanCss();
sizeAll();
setStatus('Cold start','');
requestAnimationFrame(loop);

/* if Chakra Petch arrives after first paint, rebuild the etched glyphs */
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{ buildEtchSprites(); });
}
</script>
